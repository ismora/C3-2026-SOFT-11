<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver empleados</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    
    <h1>Lista de usuarios</h1>


    <table id="tblUsuarios">
        <!-- Thead: encabezado de la tabla (nombre de las columnas) -->
        <thead>
            <!-- tr: Fila-->
            <tr>
                <!-- th: Celda de encabezado-->
                <th>Nombre</th>
                <th>Correo</th>
                <th>Certificaciones</th>
                <th>Proyectos</th>
            </tr>

        </thead>
        <tbody>

        </tbody>

    </table>


    <!-- SweetAlert2: ventanas de mensaje (en lugar de alert) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <script src="js/ver-empleados.js"></script>
</body>
</html>
